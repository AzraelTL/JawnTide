# JawnTide resource monitor. Runs next to ace-db and ace-server, reads the databases with a SELECT-only user.
# Start (Linux): docker compose -f ~/JawnTide/Ops/monitor/compose.yml --env-file ~/jawntide-server/.env up -d --build
# See README.md.
name: jawntide-monitor
services:
  ace-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: jawntide-monitor:local
    container_name: ace-monitor
    environment:
      DB_HOST: ace-db
      DB_USER: monitor
      DB_PASSWORD: ${MONITOR_DB_PASSWORD}
      # PvP damage page: the password for saving setting changes (empty = editing off). See README.md.
      MONITOR_EDIT_PASSWORD: ${MONITOR_EDIT_PASSWORD:-}
      # extra account names (comma-separated) to leave out of the reports; staff accounts are always left out
      SKIP_ACCOUNTS: ${SKIP_ACCOUNTS:-}
      INTERVAL_SECONDS: "600"
      HISTORY_DAYS: "30"
      TZ: America/New_York
    volumes:
      - monitor-data:/data
      # the server's settings list, read live for the Settings and PvP damage pages (a git pull updates it)
      - ../../Source/ACE.Server/Managers/PropertyManager.cs:/app/PropertyManager.cs:ro
      # the server's command handlers, read live for the admin command list on the Settings page
      - ../../Source/ACE.Server/Command/Handlers:/app/Handlers:ro
    ports:
      # LAN only: bound to the server's LAN address; the router does not forward TCP 8080.
      - "192.168.0.190:8080:8080"
    networks:
      - ace
    restart: unless-stopped
volumes:
  monitor-data:
networks:
  ace:
    external: true
    name: jawntide-server_default
